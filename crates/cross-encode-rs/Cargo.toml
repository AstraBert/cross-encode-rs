[package]
name = "cross-encode-rs"
version = "0.4.1"
edition = "2024"
description = "Fast cross-encoder ONNX inference with ort"
keywords = ["onnx", "cross-encoder", "reranking"]
license = "MIT"
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
dirs = { version = "7.0.0", optional = true }
hf-hub = { version = "1.0.0", optional = true }
ndarray = "0.17.2"
ort = "2.0.0-rc.13"
tokenizers = { version = "1.0.0-rc.2", default-features = false, features = [] }

[features]
default = []
hf-hub = ["dep:hf-hub", "dep:dirs"]

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
